name: Setup pinned Rust
description: Install Rustle's pinned toolchain and native Linux build dependencies.

inputs:
  install-native-dependencies:
    description: Install Linux libraries needed to compile the desktop application.
    required: false
    default: "true"
  install-cargo-deny:
    description: Install the repository-pinned cargo-deny version.
    required: false
    default: "false"

outputs:
  toolchain:
    description: Rust channel resolved from rust-toolchain.toml.
    value: ${{ steps.toolchain.outputs.channel }}
  cargo-deny-version:
    description: cargo-deny version resolved from .cargo-deny-version.
    value: ${{ steps.toolchain.outputs.cargo-deny-version }}

runs:
  using: composite
  steps:
    - name: Install Linux build dependencies
      if: runner.os == 'Linux' && inputs.install-native-dependencies == 'true'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends -y \
          libasound2-dev \
          libudev-dev \
          libwayland-dev \
          libx11-xcb-dev \
          libxkbcommon-dev \
          libxkbcommon-x11-dev \
          pkg-config

    - name: Resolve pinned toolchain
      id: toolchain
      shell: pwsh
      run: |
        $manifest = Get-Content rust-toolchain.toml -Raw
        $match = [regex]::Match($manifest, '(?m)^channel\s*=\s*"([^"]+)"\s*$')
        if (-not $match.Success) {
          throw 'rust-toolchain.toml does not declare a quoted channel'
        }
        $cargoDenyVersion = (Get-Content .cargo-deny-version -Raw).Trim()
        if (-not $cargoDenyVersion) {
          throw '.cargo-deny-version is empty'
        }
        "channel=$($match.Groups[1].Value)" >> $env:GITHUB_OUTPUT
        "cargo-deny-version=$cargoDenyVersion" >> $env:GITHUB_OUTPUT

    - name: Install pinned Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ steps.toolchain.outputs.channel }}
        components: rustfmt, clippy

    - name: Install pinned cargo-deny
      if: inputs.install-cargo-deny == 'true'
      shell: bash
      env:
        CARGO_DENY_VERSION: ${{ steps.toolchain.outputs.cargo-deny-version }}
      run: |
        actual="$(cargo deny --version 2>/dev/null || true)"
        if [[ "$actual" != "cargo-deny $CARGO_DENY_VERSION" ]]; then
          cargo install cargo-deny \
            --version "$CARGO_DENY_VERSION" \
            --locked \
            --force
        fi
