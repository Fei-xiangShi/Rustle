name: Rust CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: rust-${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux, os: ubuntu-22.04 }
          - { platform: windows, os: windows-latest }
          - { platform: macos, os: macos-latest }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libasound2-dev libpipewire-0.3-dev libclang-dev libudev-dev libwayland-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev pkg-config

      - name: Set up Rust
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Check and test
        run: |
          cargo check --locked --workspace
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked --workspace --all-targets --all-features

      - name: Check formatting, docs and dependencies
        if: runner.os == 'Linux'
        run: |
          cargo fmt --all --check
          RUSTDOCFLAGS="-D warnings" cargo doc --locked --workspace --all-features --no-deps
          cargo install cargo-deny --version "$(cat .cargo-deny-version)" --locked
          cargo install cargo-machete --version "$(cat .cargo-machete-version)" --locked
          cargo machete
          for target in x86_64-pc-windows-msvc x86_64-unknown-linux-gnu x86_64-apple-darwin aarch64-apple-darwin; do
            cargo deny --locked --workspace --all-features --target "$target" check --allow license-not-encountered --allow unmatched-source --allow unmatched-skip --allow unnecessary-skip advisories licenses bans sources
          done
