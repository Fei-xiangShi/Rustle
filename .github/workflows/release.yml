name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  APP_NAME: rustle
  APP_DISPLAY_NAME: Rustle
  APP_ID: life.fxs.rustle

permissions:
  contents: read

jobs:
  release-preflight:
    name: Release preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
      channel: ${{ steps.metadata.outputs.channel }}
      commit: ${{ steps.metadata.outputs.commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate release source
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, subprocess, tomllib
          from pathlib import Path

          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()

          commit = os.environ['GITHUB_SHA']
          if not re.fullmatch(r'[0-9a-f]{40}', commit) or git('rev-parse', 'HEAD') != commit:
              raise SystemExit('Release commit does not match checkout')
          if git('status', '--porcelain', '--untracked-files=no'):
              raise SystemExit('Release checkout has tracked changes')
          version = tomllib.loads(Path('Cargo.toml').read_text())['workspace']['package']['version']
          tag = os.environ['GITHUB_REF_NAME'] if os.environ['GITHUB_REF'].startswith('refs/tags/') else None
          if tag is not None and (tag != f'v{version}' or git('rev-parse', f'refs/tags/{tag}^{{commit}}') != commit):
              raise SystemExit('Release tag must match the package version and commit')
          metadata = {
              'schema_version': 1, 'package': 'rustle', 'version': version, 'tag': tag,
              'channel': 'preview' if '-' in version else 'stable', 'commit': commit,
              'commit_timestamp': git('show', '-s', '--format=%cI', commit),
              'toolchain': tomllib.loads(Path('rust-toolchain.toml').read_text())['toolchain']['channel'],
              'cargo_lock_sha256': hashlib.sha256(Path('Cargo.lock').read_bytes()).hexdigest(),
          }
          Path('target').mkdir(exist_ok=True)
          Path('target/release-metadata.json').write_text(json.dumps(metadata, indent=2) + '\n')
          PY

      - name: Export release metadata
        id: metadata
        shell: bash
        run: |
          echo "version=$(jq -r '.version' target/release-metadata.json)" >> "$GITHUB_OUTPUT"
          echo "tag=$(jq -r '.tag // ""' target/release-metadata.json)" >> "$GITHUB_OUTPUT"
          echo "channel=$(jq -r '.channel' target/release-metadata.json)" >> "$GITHUB_OUTPUT"
          echo "commit=$(jq -r '.commit' target/release-metadata.json)" >> "$GITHUB_OUTPUT"

      - name: Upload release metadata
        uses: actions/upload-artifact@v6
        with:
          name: release-metadata
          path: target/release-metadata.json
          if-no-files-found: error
          retention-days: 7

  linux-appimage:
    name: Linux x86_64 AppImage
    needs: release-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-preflight.outputs.commit }}

      - name: Set up Rust
        run: rustup show

      - name: Install build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y imagemagick libasound2-dev libpipewire-0.3-dev libclang-dev libudev-dev libwayland-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev pkg-config patchelf dbus-x11 xvfb xauth xdotool libgl1-mesa-dri mesa-vulkan-drivers

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-linux-x86_64-ubuntu-latest
          cache-on-failure: false
          save-if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}

      - name: Build release
        run: cargo build --locked --release --package rustle --bin rustle

      - name: Create AppImage directory structure
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/metainfo
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          mkdir -p AppDir/usr/share/licenses/${{ env.APP_NAME }}
          cp target/release/${{ env.APP_NAME }} AppDir/usr/bin/
          cp packaging/linux/${{ env.APP_ID }}.desktop AppDir/usr/share/applications/
          cp packaging/linux/${{ env.APP_ID }}.metainfo.xml AppDir/usr/share/metainfo/
          cp LICENSE AppDir/usr/share/licenses/${{ env.APP_NAME }}/LICENSE

      - name: Setup icon and AppRun
        run: |
          if [ -f "assets/icons/icon_256.png" ]; then
            cp assets/icons/icon_256.png AppDir/usr/share/icons/hicolor/256x256/apps/${{ env.APP_ID }}.png
          elif [ -f "assets/icons/icon.png" ]; then
            convert assets/icons/icon.png -resize 256x256 AppDir/usr/share/icons/hicolor/256x256/apps/${{ env.APP_ID }}.png
          else
            convert -size 256x256 xc:pink AppDir/usr/share/icons/hicolor/256x256/apps/${{ env.APP_ID }}.png 2>/dev/null || touch AppDir/usr/share/icons/hicolor/256x256/apps/${{ env.APP_ID }}.png
          fi

          cat > AppRun << APPRUN
          #!/bin/bash
          SELF=\$(readlink -f "\$0")
          HERE=\${SELF%/*}
          export PATH="\${HERE}/usr/bin:\${PATH}"
          export LD_LIBRARY_PATH="\${HERE}/usr/lib\${LD_LIBRARY_PATH:+:\${LD_LIBRARY_PATH}}"
          exec "\${HERE}/usr/bin/${{ env.APP_NAME }}" "\$@"
          APPRUN
          chmod +x AppRun

      - name: Link files to AppDir root
        run: |
          ln -sf usr/share/applications/${{ env.APP_ID }}.desktop AppDir/${{ env.APP_ID }}.desktop
          ln -sf usr/share/icons/hicolor/256x256/apps/${{ env.APP_ID }}.png AppDir/${{ env.APP_ID }}.png
          ln -sf usr/share/icons/hicolor/256x256/apps/${{ env.APP_ID }}.png AppDir/.DirIcon

      - name: Bundle shared libraries
        run: |
          curl --fail --location --retry 3 -o linuxdeploy-x86_64.AppImage https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          ./linuxdeploy-x86_64.AppImage --appimage-extract-and-run --appdir AppDir --executable target/release/${{ env.APP_NAME }} --desktop-file packaging/linux/${{ env.APP_ID }}.desktop --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/${{ env.APP_ID }}.png --custom-apprun AppRun

      - name: Download appimagetool and static runtime
        run: |
          curl --fail --location --retry 3 -o appimagetool-x86_64.AppImage https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          curl --fail --location --retry 3 -o runtime-x86_64 https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64
          chmod +x appimagetool-x86_64.AppImage
          # The runtime must not require the host's ELF loader or libfuse2.
          readelf --file-header runtime-x86_64 > /dev/null
          if readelf --program-headers runtime-x86_64 | grep -q INTERP; then
            echo 'AppImage runtime is not static' >&2
            exit 1
          fi

      - name: Build AppImage
        run: |
          ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run --runtime-file runtime-x86_64 AppDir ${{ env.APP_NAME }}-linux-x86_64.AppImage

      - name: Smoke test packaged application
        run: |
          # Check the package without inherited library search paths.
          unset LD_LIBRARY_PATH
          ./${{ env.APP_NAME }}-linux-x86_64.AppImage --appimage-extract
          LD_LIBRARY_PATH="$PWD/squashfs-root/usr/lib" ldd squashfs-root/usr/bin/${{ env.APP_NAME }} | tee appimage-dependencies.log
          if grep -q 'not found' appimage-dependencies.log; then
            exit 1
          fi
          export XDG_CONFIG_HOME="$(mktemp -d)"
          export XDG_DATA_HOME="$(mktemp -d)"
          export XDG_CACHE_HOME="$(mktemp -d)"
          dbus-run-session -- xvfb-run -a bash <<'SH'
          set -euo pipefail
          unset WAYLAND_DISPLAY
          ./squashfs-root/AppRun > appimage-startup.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if ! kill -0 "$app_pid" 2>/dev/null; then
              cat appimage-startup.log
              echo 'Packaged application exited before showing a window' >&2
              exit 1
            fi
            if xdotool search --onlyvisible --pid "$app_pid" >/dev/null 2>&1; then
              sleep 5
              if kill -0 "$app_pid" 2>/dev/null; then
                exit 0
              fi
              break
            fi
            sleep 1
          done
          cat appimage-startup.log
          echo 'Packaged application failed the window/liveness check' >&2
          exit 1
          SH

      - name: Upload AppImage diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: appimage-diagnostics
          path: appimage-*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: release-product-linux-x86_64
          path: ${{ env.APP_NAME }}-linux-x86_64.AppImage
          if-no-files-found: error
          retention-days: 7

  macos:
    name: macOS ${{ matrix.arch }} DMG
    needs: release-preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-26-intel
            arch: x86_64
          - target: aarch64-apple-darwin
            os: macos-26
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-preflight.outputs.commit }}

      - name: Set up Rust
        run: |
          rustup show
          rustup target add ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-macos-${{ matrix.arch }}
          cache-on-failure: false
          save-if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}

      - name: Build release
        run: cargo build --locked --release --package rustle --bin rustle --target ${{ matrix.target }}

      - name: Create app bundle directories
        run: |
          mkdir -p "${{ env.APP_DISPLAY_NAME }}.app/Contents/MacOS"
          mkdir -p "${{ env.APP_DISPLAY_NAME }}.app/Contents/Resources"
          cp target/${{ matrix.target }}/release/${{ env.APP_NAME }} "${{ env.APP_DISPLAY_NAME }}.app/Contents/MacOS/"

      - name: Create Info.plist
        env:
          VERSION: ${{ needs.release-preflight.outputs.version }}
        run: |
          cat > "${{ env.APP_DISPLAY_NAME }}.app/Contents/Info.plist" << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>${{ env.APP_NAME }}</string>
              <key>CFBundleIdentifier</key>
              <string>${{ env.APP_ID }}</string>
              <key>CFBundleName</key>
              <string>${{ env.APP_DISPLAY_NAME }}</string>
              <key>CFBundleIconFile</key>
              <string>AppIcon</string>
              <key>CFBundleIconName</key>
              <string>AppIcon</string>
              <key>CFBundleVersion</key>
              <string>$VERSION</string>
              <key>CFBundleShortVersionString</key>
              <string>$VERSION</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>LSMinimumSystemVersion</key>
              <string>10.13</string>
              <key>CFBundleURLTypes</key>
              <array>
                  <dict>
                      <key>CFBundleURLName</key>
                      <string>Rustle Music Player</string>
                      <key>CFBundleURLSchemes</key>
                      <array>
                          <string>rustle</string>
                      </array>
                  </dict>
              </array>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          PLIST

      - name: Compile app icon assets
        run: |
          mkdir -p build/macos/AppIcon.icon/Assets
          cp assets/icons/icon.png build/macos/AppIcon.icon/Assets/icon.png
          cat > build/macos/AppIcon.icon/icon.json <<'JSON'
          {
            "fill" : {
              "automatic-gradient" : "extended-srgb:0.00000,0.53333,1.00000,1.00000"
            },
            "groups" : [
              {
                "layers" : [
                  {
                    "blend-mode" : "normal",
                    "fill" : "automatic",
                    "glass" : false,
                    "hidden" : false,
                    "image-name" : "icon.png",
                    "name" : "icon",
                    "position" : {
                      "scale" : 0.725,
                      "translation-in-points" : [
                        0,
                        0
                      ]
                    }
                  }
                ],
                "shadow" : {
                  "kind" : "neutral",
                  "opacity" : 0.5
                },
                "translucency" : {
                  "enabled" : true,
                  "value" : 0.5
                }
              }
            ],
            "supported-platforms" : {
              "circles" : [
                "watchOS"
              ],
              "squares" : "shared"
            }
          }
          JSON
          xcrun actool build/macos/AppIcon.icon --compile "${{ env.APP_DISPLAY_NAME }}.app/Contents/Resources" --output-format human-readable-text --notices --warnings --errors --output-partial-info-plist build/macos/appicon-partial.plist --app-icon AppIcon --include-all-app-icons --enable-on-demand-resources NO --development-region en --target-device mac --minimum-deployment-target 26.0 --platform macosx

      - name: Create DMG
        run: |
          hdiutil create -volname "${{ env.APP_DISPLAY_NAME }}" -srcfolder "${{ env.APP_DISPLAY_NAME }}.app" -ov -format UDZO "${{ env.APP_NAME }}-macos-${{ matrix.arch }}.dmg"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: release-product-macos-${{ matrix.arch }}
          path: ${{ env.APP_NAME }}-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows x86_64 EXE and MSI
    needs: release-preflight
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-preflight.outputs.commit }}

      - name: Set up Rust
        run: rustup show

      - name: Install packaging tools
        shell: pwsh
        run: |
          choco install imagemagick --no-progress -y
          choco install wixtoolset --version=3.14.1 --no-progress -y
          cargo install cargo-wix --version 0.3.9 --locked

      - name: Generate Windows ICO icon
        shell: pwsh
        run: |
          magick assets/icons/icon.png -define icon:auto-resize=256,128,64,48,32,16 assets/icons/icon.ico

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-windows-x86_64
          cache-on-failure: false
          save-if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}

      - name: Build Windows release
        shell: pwsh
        run: |
          cargo build --locked --release --package rustle --bin rustle
          cargo build --locked --release --package rustle-cleanup --bin rustle-cleanup

      - name: Stage portable executable
        shell: pwsh
        run: |
          Copy-Item "target/release/${{ env.APP_NAME }}.exe" "${{ env.APP_NAME }}-windows-x86_64.exe"

      - name: Build MSI
        shell: pwsh
        env:
          VERSION: ${{ needs.release-preflight.outputs.version }}
        run: |
          cargo wix --package rustle --include wix/main.wxs --no-build --target-bin-dir target/release `
            --culture zh-cn --locale wix/zh-CN.wxl `
            --output "rustle-$env:VERSION-windows-x86_64.msi"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: release-product-windows-x86_64
          path: |
            ${{ env.APP_NAME }}-windows-x86_64.exe
            rustle-${{ needs.release-preflight.outputs.version }}-windows-x86_64.msi
          if-no-files-found: error
          retention-days: 7

  release:
    name: Verify and publish release
    needs: [release-preflight, linux-appimage, macos, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-preflight.outputs.commit }}

      - name: Download release metadata
        uses: actions/download-artifact@v8
        with:
          name: release-metadata
          path: release-input

      - name: Download product artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-product-*
          path: release-input/products
          merge-multiple: true

      - name: Build verified release bundle
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, shutil, subprocess, tomllib
          from pathlib import Path

          metadata_path = Path('release-input/release-metadata.json')
          metadata = json.loads(metadata_path.read_text())
          version = tomllib.loads(Path('Cargo.toml').read_text())['workspace']['package']['version']
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if (metadata['schema_version'] != 1 or metadata['package'] != 'rustle'
                  or metadata['version'] != version or metadata['commit'] != commit
                  or metadata['cargo_lock_sha256'] != hashlib.sha256(Path('Cargo.lock').read_bytes()).hexdigest()):
              raise SystemExit('Release metadata does not match checkout')
          expected = {
              'rustle-linux-x86_64.AppImage', 'rustle-macos-arm64.dmg',
              'rustle-macos-x86_64.dmg', 'rustle-windows-x86_64.exe',
              f'rustle-{version}-windows-x86_64.msi',
          }
          files = list(Path('release-input/products').iterdir())
          if any(p.is_symlink() or not p.is_file() for p in files) or {p.name for p in files} != expected:
              raise SystemExit('Unexpected or missing release products')
          bundle = Path('release-bundle')
          bundle.mkdir()
          artifacts = []
          for p in sorted(files):
              shutil.copyfile(p, bundle / p.name)
              artifacts.append({'name': p.name, 'size': p.stat().st_size,
                                'sha256': hashlib.sha256(p.read_bytes()).hexdigest()})
          manifest = {key: metadata[key] for key in ('schema_version', 'package', 'version', 'tag', 'channel', 'commit')}
          manifest['artifacts'] = artifacts
          (bundle / 'release-manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          shutil.copyfile(metadata_path, bundle / metadata_path.name)
          checksums = ''.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n' for p in sorted(bundle.iterdir()))
          (bundle / 'SHA256SUMS.txt').write_text(checksums)
          PY
          (cd release-bundle && sha256sum --check SHA256SUMS.txt)

      - name: Upload verified release bundle
        uses: actions/upload-artifact@v6
        with:
          name: release-bundle
          path: release-bundle
          if-no-files-found: error
          retention-days: 7

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: release-bundle/*
          draft: false
          prerelease: ${{ needs.release-preflight.outputs.channel == 'preview' }}
          generate_release_notes: true

  aur:
    name: Publish stable AUR packages
    needs: [release-preflight, release]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: startsWith(github.ref, 'refs/tags/') && needs.release-preflight.outputs.channel == 'stable'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-preflight.outputs.commit }}

      - name: Update PKGBUILD versions
        env:
          VERSION: ${{ needs.release-preflight.outputs.version }}
        run: |
          sed -i "s/pkgver=.*/pkgver=$VERSION/" aur/PKGBUILD
          sed -i "s/pkgver=.*/pkgver=$VERSION/" aur-bin/PKGBUILD

      - name: Publish rustle to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v4.1.2
        with:
          pkgname: rustle
          pkgbuild: aur/PKGBUILD
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to ${{ needs.release-preflight.outputs.version }}"
          force_push: true

      - name: Publish rustle-bin to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v4.1.2
        with:
          pkgname: rustle-bin
          pkgbuild: aur-bin/PKGBUILD
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to ${{ needs.release-preflight.outputs.version }}"
          force_push: true
