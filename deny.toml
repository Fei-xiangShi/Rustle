    { crate = "toml_edit@0.20.2", reason = "manifest/proc-macro tooling spans TOML edit generations" },
    { crate = "uuid@0.8.2", reason = "legacy platform/media crates retain UUID 0.8" },
    { crate = "webpki-roots@0.26.11", reason = "SQLx and current HTTP stacks use distinct root-store APIs" },
    { crate = "windows@0.44.0", reason = "souvlaki retains Windows bindings 0.44 beside current platform crates" },
    { crate = "windows_aarch64_gnullvm@0.42.2", reason = "transitive Windows binding generations carry matching target support crates" },
    { crate = "windows_aarch64_gnullvm@0.48.5", reason = "transitive Windows binding generations carry matching target support crates" },
