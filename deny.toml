[graph]
all-features = true

[advisories]
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "ncm-api-rs uses rsa for client-side public-key protocol encryption, not attacker-observable private-key operations; remove when the protocol adapter replaces rsa or upstream ships a constant-time release" },
    { id = "RUSTSEC-2024-0436", reason = "paste is transitive through current media/image dependencies; remove when the owning crates migrate to maintained macro support" },
    { id = "RUSTSEC-2025-0141", reason = "bincode 1.3 is reachable only through the current Iced debug/devtools graph; remove with the production feature-hygiene migration or an upstream Iced serialization change" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser remains transitive through the current text stack; remove when the owning font/render crates migrate to a fixed release" },
]

[licenses]
allow = [
    "0BSD",
    "AGPL-3.0-or-later",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8
exceptions = [
    { allow = ["WTFPL"], crate = "ncm-api-rs@0.1.0" },
]

[licenses.private]
ignore = false

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
skip = [
    { crate = "bitflags@1.3.2", reason = "legacy renderer/audio/platform crates still require bitflags 1; converge through their owning dependency upgrades" },
    { crate = "core-foundation@0.9.4", reason = "macOS integrations span two upstream Core Foundation binding generations" },
    { crate = "cpufeatures@0.2.17", reason = "crypto/media transitive crates have not converged on cpufeatures 0.3" },
    { crate = "dpi@0.1.2", reason = "the pinned windowing stack resolves the same version from distinct package sources" },
    { crate = "float-cmp@0.9.0", reason = "renderer transitive crates retain an older float comparison API" },
    { crate = "foldhash@0.1.5", reason = "transitive collection crates span compatible but semver-distinct foldhash generations" },
    { crate = "font-types@0.11.3", reason = "font/render crates intentionally span two fontations release trains" },
    { crate = "getrandom@0.2.17", reason = "crypto and random ecosystems still require the 0.2 API" },
    { crate = "getrandom@0.3.4", reason = "random ecosystems still require the 0.3 API beside 0.4" },
    { crate = "hashbrown@0.15.5", reason = "transitive collection/build tooling spans supported hashbrown release trains" },
    { crate = "hashbrown@0.16.1", reason = "transitive collection/build tooling spans supported hashbrown release trains" },
    { crate = "heck@0.4.1", reason = "proc-macro crates have not all migrated to heck 0.5" },
    { crate = "jni@0.21.1", reason = "Android-capable transitive platform crates span JNI API generations" },
    { crate = "jni-sys@0.3.1", reason = "Android-capable transitive platform crates span JNI ABI generations" },
    { crate = "keyboard-types@0.7.0", reason = "global-hotkey and the pinned Winit stack use different keyboard-types APIs" },
    { crate = "kurbo@0.10.4", reason = "SVG and renderer crates span two geometry API generations" },
    { crate = "libloading@0.7.4", reason = "native backend crates retain the older dynamic-library API" },
    { crate = "miniz_oxide@0.8.9", reason = "PNG/compression transitive crates span two maintained release trains" },
    { crate = "objc2@0.5.2", reason = "macOS dependencies retain objc2 0.5 while Rustle uses 0.6 APIs" },
    { crate = "pastey@0.1.1", reason = "transitive macro crates span pastey API generations" },
    { crate = "png@0.17.16", reason = "tiny-skia requires PNG 0.17 while image uses PNG 0.18" },
    { crate = "proc-macro-crate@1.3.1", reason = "platform proc macros retain older manifest parsing APIs" },
    { crate = "proc-macro-crate@2.0.2", reason = "platform proc macros retain older manifest parsing APIs" },
    { crate = "quick-xml@0.41.0", reason = "transitive metadata parsing retains quick-xml 0.41 beside Rustle 0.42" },
    { crate = "r-efi@5.3.0", reason = "getrandom release trains require distinct UEFI binding generations" },
    { crate = "rand@0.8.8", reason = "audio/platform transitive crates retain rand 0.8" },
    { crate = "rand@0.9.5", reason = "transitive crates retain rand 0.9 beside Rustle 0.10" },
    { crate = "rand_chacha@0.3.1", reason = "rand 0.8 requires its matching ChaCha implementation" },
    { crate = "rand_core@0.6.4", reason = "rand 0.8 requires rand_core 0.6" },
    { crate = "rand_core@0.9.5", reason = "rand 0.9 requires rand_core 0.9" },
    { crate = "read-fonts@0.37.0", reason = "font/render crates intentionally span two fontations release trains" },
    { crate = "redox_syscall@0.5.18", reason = "cross-platform transitive crates span Redox ABI generations" },
    { crate = "reqwest@0.12.28", reason = "the pinned ncm-api-rs adapter owns Reqwest 0.12; convergence requires a reviewed adapter revision" },
    { crate = "rustc-hash@1.1.0", reason = "renderer/platform transitive crates retain rustc-hash 1" },
    { crate = "serde_spanned@0.6.9", reason = "TOML/parser release trains require distinct serde_spanned APIs" },
    { crate = "skrifa@0.40.0", reason = "font/render crates intentionally span two fontations release trains" },
    { crate = "smol_str@0.2.2", reason = "platform/renderer crates retain smol_str 0.2 beside 0.3" },
    { crate = "syn@1.0.109", reason = "legacy proc macros still require Syn 1" },
    { crate = "syn@2.0.119", reason = "proc macros span Syn 2 and Syn 3 APIs" },
    { crate = "thiserror@1.0.69", reason = "legacy transitive crates retain thiserror 1" },
