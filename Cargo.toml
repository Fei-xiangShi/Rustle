[workspace]
members = [".", "xtask"]
default-members = ["."]
resolver = "3"

[workspace.package]
version = "0.5.2"
edition = "2024"
rust-version = "1.98.0"
authors = ["Fei_xiangShi"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/Fei-xiangShi/Rustle"
homepage = "https://github.com/Fei-xiangShi/Rustle"

[workspace.dependencies]
anyhow = "1.0.104"
serde = "1.0.229"
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = "1.53"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-appender = "0.2.5"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
undocumented_unsafe_blocks = "deny"

[package]
name = "rustle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A modern music player built with Rust and iced, supporting NetEase Cloud Music"
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["music", "player", "netease", "iced", "gui"]
categories = ["multimedia::audio"]
publish = false

[lints]
workspace = true

[features]
default = []
devtools = ["iced/debug"]

[dependencies]
iced = { version = "=0.15.0-dev", features = ["tokio", "advanced", "canvas", "image", "svg"] }
iced_runtime = { version = "=0.15.0-dev" }
bytemuck = { version = "1.25", features = ["derive"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "sync", "time", "fs", "net", "io-util"] }
rodio = { version = "0.22.2", features = ["symphonia-all"] }
spectrum-analyzer = "1.8.0"

sqlx = { version = "0.8.6", features = ["sqlite", "runtime-tokio-rustls", "macros"] }
lofty = "0.25.1"
walkdir = "2.5.0"
directories = "6.0.0"

serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
anyhow.workspace = true
thiserror.workspace = true

# Local playlist import
rayon = "1.12.0"
encoding_rs = "0.8.35"
notify = { version = "8.2", features = ["serde"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
interprocess = { version = "2", features = ["tokio"] }
rfd = "0.17.2"
async-stream = "0.3.6"
rand = "0.10.2"
cosmic-text = "0.19.0"
parking_lot = "0.12"
global-hotkey = "0.8"

# SDF text rendering
sdf_glyph_renderer = "1.1.0"
ab_glyph = "0.2"
quick-xml = "0.42.0"
futures-util = "0.3.34"
discord-rich-presence = "1.1.0"

# Netease Cloud Music API
ncm-api-rs = { git = "https://github.com/SPlayer-Dev/ncm-api-rs.git", rev = "133b65bfe482e41ebccf018870d3fce07bf58eb3" }
qrcode-generator = "6.0"

reqwest = { version = "0.13", default-features = false, features = ["rustls", "cookies", "json", "gzip", "stream"] }

regex = "1.13"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }

[target.'cfg(target_os = "linux")'.dependencies]
mpris-server = "0.10.0"
ksni = { version = "0.3.6", default-features = false, features = ["tokio"] }
x11rb = "0.14.0"

[patch.crates-io]
iced = { git = "https://github.com/Fei-xiangShi/iced.git", rev = "573ebbf00ed3f544e784488cd3e71ab0ea10ec1b" }
iced_runtime = { git = "https://github.com/Fei-xiangShi/iced.git", rev = "573ebbf00ed3f544e784488cd3e71ab0ea10ec1b" }
smithay-client-toolkit = { git = "https://github.com/Fei-xiangShi/client-toolkit.git", rev = "f69a98395ead55777832525623ff82d40c16a25b" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["objc2-core-services"] }
tray-icon = "0.24.2"

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
souvlaki = "0.8.3"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.31"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
