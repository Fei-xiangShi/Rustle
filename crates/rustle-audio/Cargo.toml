[package]
name = "rustle-audio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
parking_lot = "0.12"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
rodio = { version = "0.22.2", features = ["symphonia-all"] }
rustle-application.workspace = true
rustle-domain.workspace = true
serde.workspace = true
serde_json.workspace = true
spectrum-analyzer = "1.8.0"
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
tracing.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# Ubuntu 22.04 ships PipeWire 0.3.48; do not enable newer header APIs.
pipewire = { version = "0.10.0", features = ["v0_3_45"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-audio = { version = "0.3.2", default-features = false, features = [
    "std",
    "AudioHardware",
] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Threading",
] }
windows-core = "0.62.2"
