[package]
name = "rustle-audio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
parking_lot = "0.12"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
rodio = { version = "0.22.2", features = ["symphonia-all"] }
rustle-application.workspace = true
rustle-domain.workspace = true
serde.workspace = true
serde_json.workspace = true
spectrum-analyzer = "1.8.0"
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
tracing.workspace = true
